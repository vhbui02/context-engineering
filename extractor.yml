---
- name: Extract LLM-feedable knowledge from third-party repositories
  hosts: localhost
  connection: local # gather facts from the local machine and overwrite the remote node's facts
  gather_facts: true
  environment:
    http_proxy: "{{ http_proxy | default(omit, true) }}"
    https_proxy: "{{ https_proxy | default(omit, true) }}"
    no_proxy: "{{ no_proxy | default(omit, true) }}"

  tasks:
    - name: Extract documentation from configured repositories
      when: ansible_run_tags | intersect([config.tag]) | length > 0 or 'all' in ansible_run_tags # handle per-item selection
      ansible.builtin.include_tasks:
        file: tasks/_extract.yml
        apply:
          tags: always # ensure after config matching, tasks within _extract.yml is also running
      vars:
        repo_name: "{{ config.repo_name }}"
        repo_version: "{{ config.repo_version | default(omit) }}"
        repo_url: "{{ config.repo_url }}"
        rsync_steps: "{{ config.rsync_steps }}"
      loop: "{{ extractor_configs }}"
      loop_control:
        loop_var: "config"
        label: "{{ config.repo_name }}"
      tags: always

    # Exceptions: this task required dynamic GitHub tag fetch
    - name: Extract documentation from Vagrant
      ansible.builtin.import_tasks: tasks/vagrant.yml
      tags: vagrant
