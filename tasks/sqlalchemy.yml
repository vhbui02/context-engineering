---
- name: Extract SQLAlchemy documentation
  ansible.builtin.include_tasks: _extract.yml
  vars:
    repo_url: git@github.com:sqlalchemy/sqlalchemy.git
    rsync_steps:
      - src: doc/build/
        dest: docs/
        opts:
          - "--exclude=/changelog"
          - "--include=*/"
          - "--include=*.rst"
          - "--exclude=*"
      - src: examples/
        dest: examples/
        opts:
          - "--include=*/"
          - "--include=*.py"
          - "--exclude=*"
