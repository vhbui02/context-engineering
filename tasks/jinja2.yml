---
- name: Extract Jinja2 documentation
  ansible.builtin.include_tasks: _extract.yml
  vars:
    repo_url: git@github.com:pallets/jinja.git
    rsync_steps:
      - src: docs/
        dest: docs/
        opts:
          - "--include=*/"
          - "--include=*.rst"
          - "--exclude=*"
      - src: examples/
        dest: examples/
        opts:
          - "--include=*/"
          - "--include=*.py"
          - "--exclude=*"
