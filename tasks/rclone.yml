---
- name: Extract Rclone documentation
  ansible.builtin.include_tasks: _extract.yml
  vars:
    repo_url: git@github.com:rclone/rclone.git
    rsync_steps:
      - src: docs/content
        dest: docs/content
        opts:
          - "--include=*/"
          - "--include=*.md"
          - "--exclude=*"
