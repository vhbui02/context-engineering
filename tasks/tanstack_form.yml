---
- name: Extract TanStack Form documentation
  ansible.builtin.include_tasks: _extract.yml
  vars:
    _name: tanstack-form
    repo_url: git@github.com:TanStack/form.git
    rsync_steps:
      # No file-type filter -- intentional, copies all non-excluded files
      - src: docs/
        dest: docs/
        opts:
          - "--include=/framework/react"
          - "--exclude=/framework/*"
          - "--include=*/"
          - "--include=*.md"
          - "--exclude=*"
