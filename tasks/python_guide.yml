---
- name: Extract Python Guide documentation
  ansible.builtin.include_tasks: _extract.yml
  vars:
    repo_url: git@github.com:realpython/python-guide.git
    rsync_steps:
      - src: docs/
        dest: docs/
        opts:
          - "--exclude=404.rst"
          - "--include=*/"
          - "--include=*.rst"
          - "--exclude=*"
