---
- name: Extract React Testing Library documentation
  ansible.builtin.include_tasks: _extract.yml
  vars:
    repo_url: git@github.com:testing-library/testing-library-docs.git
    rsync_steps:
      - src: docs/
        dest: docs/
        opts:
          - "--include=/react-testing-library"
          - "--include=/react-native-testing-library"
          - "--exclude=/*-testing-library"
          - "--include=*/"
          - "--include=*.md"
          - "--include=*.mdx"
          - "--exclude=*"
