---
- name: Validate required extraction variables
  ansible.builtin.assert:
    that:
      - repo_name is defined
      - repo_name | trim | length > 0
      - repo_url is defined
      - repo_url | trim | length > 0
      - rsync_steps is iterable
      - rsync_steps is not mapping
      - rsync_steps | length > 0
    fail_msg: "'repo_name', 'repo_url', and 'rsync_steps' must be defined when including '_extract.yml'"

- name: Extract repository
  block:
    - name: Clone repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "/tmp/{{ repo_name }}"
        depth: 1
        single_branch: true
        accept_hostkey: true
        #update: yes
      check_mode: false # CAUTION: rsync need dest directory

    - name: Synchronize files from cloned repository
      ansible.posix.synchronize:
        src: "/tmp/{{ repo_name }}/{{ item.src }}"
        dest: "{{ playbook_dir }}/build/{{ repo_name }}/{{ item.dest }}"
        archive: true
        delete: false
        rsync_opts: "{{ ['-m', '--delete-during', '--delete-excluded', '--mkpath'] + item.opts }}"
      loop: "{{ rsync_steps }}"

    - name: Generate Markdown file for LLM
      ansible.builtin.command:
        cmd: >-
          files-to-prompt {{ playbook_dir }}/build/{{ repo_name }}/
            -m
            -o {{ playbook_dir }}/build/{{ ansible_date_time.date }}-{{ repo_name }}.md

    - name: Find outdated Markdown files
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/build/"
        patterns: "*-{{ repo_name }}.md"
        excludes: "{{ ansible_date_time.date }}-{{ repo_name }}.md"
      register: _extract_old_markdown_files

    - name: Remove outdated Markdown files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _extract_old_markdown_files.files }}"

  always:
    - name: Clean up temp directory
      ansible.builtin.file:
        path: "/tmp/{{ repo_name }}"
        state: absent
      check_mode: false
      diff: false
