---
- name: Extract msgspec documentation
  ansible.builtin.include_tasks: _extract.yml
  vars:
    repo_url: git@github.com:jcrist/msgspec
    rsync_steps:
      - src: docs/
        dest: docs/
        opts:
          - "--exclude=/_static"
          - "--exclude=/_templates"
          - "--include=*/"
          - "--include=*.rst"
          - "--exclude=*"
      - src: examples/
        dest: examples/
        opts:
          - "--include=*/"
          - "--include=*.py"
          - "--exclude=*"
