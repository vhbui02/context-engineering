---
- name: Fetch the latest tag on hashicorp/vagrant GitHub Repository
  ansible.builtin.uri:
    url: "https://api.github.com/repos/hashicorp/vagrant/tags?per_page=1"
  register: _vagrant_tags

- name: Extract Vagrant documentation
  ansible.builtin.include_tasks: _extract.yml
  vars:
    repo_name: vagrant
    repo_url: https://github.com/hashicorp/web-unified-docs.git
    rsync_steps:
      - src: "content/vagrant/{{ _vagrant_tags.json[0].name }}/content/docs/"
        dest: docs/
        opts:
          - "--include=*/"
          - "--include=*.mdx"
          - "--exclude=*"
