---
- name: Extract Vitest documentation
  ansible.builtin.include_tasks: _extract.yml
  vars:
    repo_url: git@github.com:vitest-dev/vitest.git
    rsync_steps:
      - src: docs/
        dest: docs/
        opts:
          - "--exclude=/.vitepress"
          - "--include=*/"
          - "--include=*.md"
          - "--exclude=*"
      - src: examples/
        dest: examples/
        opts:
          - "--include=*/"
          - "--include=*.js"
          - "--include=*.jsx"
          - "--include=*.ts"
          - "--include=*.tsx"
          - "--exclude=*"
